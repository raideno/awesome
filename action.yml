name: "Build Awesome Website"
description: "Builds the Awesome Website from a user-provided YAML file."
branding:
  icon: book-open
  color: orange
inputs:
  yaml-path:
    description: "Path to the YAML file to use as data source, relative to repository-directory-path (or the workspace root if not set)."
    required: true
  plugins-directory-path:
    description: "Optional path to a directory containing custom plugins, relative to repository-directory-path (or the workspace root if not set). Default is 'plugins'."
    required: false
  base:
    description: "Optional base path (e.g. /my-site/) to host under. Default is the repository name to support GitHub Pages."
    required: false
  repository-directory-path:
    description: "Optional path (relative to the workspace root) to the sub-directory that should be treated as the repository root. When set, yaml-path and plugins-directory-path are resolved relative to this sub-directory. Defaults to the workspace root."
    required: false
runs:
  using: "composite"
  steps:
    - name: determine awesome source ref
      id: awesome-ref
      run: |
        REF="${{ github.action_ref }}"
        if [ -z "$REF" ]; then
          REF="main"
        fi
        echo "value=$REF" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: checkout awesome website source
      uses: actions/checkout@v4
      with:
        repository: raideno/awesome
        ref: ${{ steps.awesome-ref.outputs.value }}
        fetch-depth: 0
        path: awesome-src

    - name: setup node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: install dependencies
      run: |
        cd awesome-src
        npm ci
      shell: bash

    - name: determine repository directory
      id: repo-dir
      run: |
        if [ -n "${{ inputs.repository-directory-path }}" ]; then
          echo "value=${{ github.workspace }}/${{ inputs.repository-directory-path }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: copy user YAML file
      run: |
        REPO_DIR="${{ steps.repo-dir.outputs.value }}"
        SRC_YAML="$REPO_DIR/${{ inputs.yaml-path }}"
        DEST_YAML="awesome-src/packages/website/${{ inputs.yaml-path }}"
        mkdir -p "$(dirname "$DEST_YAML")"
        cp "$SRC_YAML" "$DEST_YAML"
        YAML_DIR="$(dirname "$SRC_YAML")"
        if [ -f "$YAML_DIR/README.md" ]; then
          cp "$YAML_DIR/README.md" "awesome-src/packages/website/$(dirname "${{ inputs.yaml-path }}")/README.md"
          echo "[awesome]: README.md copied."
        else
          echo "[awesome]: No README.md found, skipping."
        fi
      shell: bash

    - name: determine BASE
      id: base
      run: |
        if [ -n "${{ inputs.base }}" ]; then
          echo "value=${{ inputs.base }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: get user repository commit hash
      id: user-commit
      run: |
        echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: get awesome tag
      id: awesome-tag
      run: |
        cd awesome-src
        TAG="${{ github.action_ref }}"
        if [ -z "$TAG" ]; then
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
        fi
        if [ -z "$TAG" ]; then
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
        fi
        if [ -z "$TAG" ]; then
          TAG=$(git rev-parse --short HEAD)
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: build internal packages
      run: |
        cd awesome-src
        npm run build --workspace storage-service
      shell: bash

    - name: build awesome website
      env:
        BASE: ${{ steps.base.outputs.value }}
        LIST_FILE_PATH: ${{ inputs.yaml-path }}
        PLUGINS_DIRECTORY_PATH: ${{ inputs.plugins-directory-path }}
        REPOSITORY_DIRECTORY_PATH: ${{ steps.repo-dir.outputs.value }}
        GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        USER_REPOSITORY_COMMIT_HASH: ${{ steps.user-commit.outputs.hash }}
        AWESOME_WEBSITE_TAG: ${{ steps.awesome-tag.outputs.tag }}
      run: |
        cd awesome-src
        npm run build --workspace website
      shell: bash

    - name: backward compatibility
      run: |
        mkdir -p awesome-website-src
        cp -r awesome-src/packages/website/dist awesome-website-src/dist
      shell: bash
