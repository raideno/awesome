name: build website

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install dependencies
        run: npm ci

      - name: get user repository commit hash
        id: user-commit
        run: |
          echo "hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: get awesome tag
        id: awesome-tag
        run: |
          TAG="${{ github.action_ref }}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: build
        env:
          BASE: /
          LIST_FILE_PATH: ./example.list.yaml
          PLUGINS_DIRECTORY_PATH: plugins
          REPOSITORY_DIRECTORY_PATH: ${{ github.workspace }}
          REPOSITORY_BUNDLED_FILES: README.md,example.list.yaml
          REPOSITORY_IGNORE: ""
          REPOSITORY_PUBLIC_SUBDIR: repository
          GITHUB_REPOSITORY_URL: https://github.com/raideno/awesome
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          USER_REPOSITORY_COMMIT_HASH: ${{ steps.user-commit.outputs.hash }}
          AWESOME_WEBSITE_TAG: ${{ steps.awesome-tag.outputs.tag }}
        run: npm run build
